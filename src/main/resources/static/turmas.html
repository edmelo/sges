<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGES - Turmas</title>
  <style>
    :root { --primary:#1f6feb; --danger:#d32f2f; --ok:#2e7d32; --muted:#666; }
    html, body { margin:0; padding:0; font-family:Segoe UI, Roboto, Arial, Helvetica, sans-serif; background:#f6f8fa; color:#0a0a0a; }
    header { background:#0d1117; color:#fff; padding:16px 20px; display:flex; gap:16px; align-items:center; }
    header h1 { margin:0; font-size:20px; flex:1; }
    header nav a { color:#c9d1d9; text-decoration:none; margin-left:12px; }
    header nav a:hover { color:#fff; text-decoration:underline; }
    main { padding:20px; max-width:1100px; margin:0 auto; }
    .card { background:#fff; border:1px solid #d0d7de; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .card + .card { margin-top:16px; }
    .card-header { padding:12px 16px; border-bottom:1px solid #d0d7de; font-weight:600; display:flex; gap:10px; align-items:center; }
    .card-body { padding:16px; }
    form .row { display:flex; gap:12px; flex-wrap:wrap; }
    .field { flex:1 1 240px; min-width:220px; }
    label { display:block; font-size:12px; color:#444; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #c7ccd1; border-radius:6px; font-size:14px; }
    input:focus { outline:2px solid var(--primary); border-color:var(--primary); }
    .actions { display:flex; gap:10px; margin-top:12px; }
    button { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:10px 14px; font-weight:600; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-secondary { background:#eaeef2; color:#111; }
    .btn-link { background:transparent; color:var(--primary); padding:6px 8px; border:none; }
    .muted { color:var(--muted); }
    table { border-collapse:collapse; width:100%; }
    th, td { border-bottom:1px solid #e6ebf1; padding:10px 8px; text-align:left; font-size:14px; }
    th { background:#f0f3f6; font-weight:600; }
    tr:hover td { background:#fafbfc; }
    .right { text-align:right; }
    .errors { margin:0; padding-left:18px; color:var(--danger); }
    .toast { position:fixed; right:20px; bottom:20px; background:#111; color:#fff; padding:10px 14px; border-radius:8px; opacity:0.95; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #c7ccd1; background:#fff; }
    .hidden { display:none !important; }
    @media (max-width: 720px) {
      .right { text-align:left; }
      .hide-sm { display:none; }
    }
  </style>
</head>
<body>
<header>
  <h1>SGES - Gestão de Turmas</h1>
  <nav>
    <a href="/">Alunos</a>
    <a href="/professores.html">Professores</a>
    <a href="/turmas.html" aria-current="page">Turmas</a>
    <a href="/avaliacoes.html">Avaliações</a>
    <a href="/frequencias.html">Frequências</a>
    <a href="/comunicacoes.html">Comunicações</a>
    <a href="/financeiro.html">Financeiro</a>
  </nav>
</header>
<main>
  <section class="card" aria-labelledby="form-title">
    <div class="card-header">
      <span id="form-title">Cadastrar / Editar Turma</span>
      <span id="form-mode" class="badge" aria-live="polite">Novo</span>
    </div>
    <div class="card-body">
      <form id="turma-form" novalidate>
        <input type="hidden" id="id" />
        <div class="row">
          <div class="field">
            <label for="nome">Nome *</label>
            <input id="nome" name="nome" type="text" required maxlength="120" placeholder="Ex: Turma 1A" />
          </div>
          <div class="field">
            <label for="codigo">Código *</label>
            <input id="codigo" name="codigo" type="text" required maxlength="30" placeholder="Ex: T-1A-2025" />
          </div>
          <div class="field">
            <label for="capacidade">Capacidade *</label>
            <input id="capacidade" name="capacidade" type="number" min="1" step="1" required placeholder="Ex: 35" />
          </div>
        </div>
        <div class="row">
          <div class="field" style="flex: 1 1 100%; min-width:300px;">
            <label for="descricao">Descrição</label>
            <input id="descricao" name="descricao" type="text" maxlength="255" placeholder="Descrição breve da turma" />
          </div>
        </div>
        <ul id="form-errors" class="errors hidden" aria-live="polite"></ul>
        <div class="actions">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="btn-clear" class="btn-secondary">Limpar</button>
        </div>
        <p class="muted">Campos marcados com * são obrigatórios.</p>
      </form>
    </div>
  </section>

  <section class="card" aria-labelledby="list-title">
    <div class="card-header">
      <span id="list-title">Turmas Cadastradas</span>
    </div>
    <div class="card-body">
      <div class="row" style="margin-bottom:8px; align-items:center;">
        <div class="field" style="min-width:260px;">
          <label for="filtro" class="muted">Filtro rápido (nome/código)</label>
          <input id="filtro" type="text" placeholder="Digite para filtrar..." />
        </div>
        <div class="right" style="flex:1;">
          <button type="button" id="btn-recarregar" class="btn-secondary">Recarregar</button>
        </div>
      </div>
      <div style="overflow:auto;">
        <table aria-describedby="list-title">
          <thead>
          <tr>
            <th class="hide-sm">ID</th>
            <th>Nome</th>
            <th>Código</th>
            <th>Capacidade</th>
            <th class="hide-sm">Descrição</th>
            <th class="right">Ações</th>
          </tr>
          </thead>
          <tbody id="tbody-turmas">
          <tr><td colspan="6" class="muted">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
  const api = {
    list: () => fetch(`/api/turmas`).then(r => okJson(r)),
    get: (id) => fetch(`/api/turmas/${id}`).then(r => okJson(r)),
    create: (data) => fetch(`/api/turmas`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => okJson(r)),
    update: (id, data) => fetch(`/api/turmas/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => okJson(r)),
    remove: (id) => fetch(`/api/turmas/${id}`, { method:'DELETE' }).then(r => okVoid(r)),
  };

  function okJson(resp){
    if(resp.ok) return resp.json();
    return resp.json().catch(() => ({ message: resp.statusText })).then(err => Promise.reject(err));
  }
  function okVoid(resp){
    if(resp.ok) return;
    return resp.json().catch(() => ({ message: resp.statusText })).then(err => Promise.reject(err));
  }

  let turmas = [];

  const tbody = document.getElementById('tbody-turmas');
  const filtro = document.getElementById('filtro');
  const form = document.getElementById('turma-form');
  const formErrors = document.getElementById('form-errors');
  const formMode = document.getElementById('form-mode');
  const toast = document.getElementById('toast');

  const $id = document.getElementById('id');
  const $nome = document.getElementById('nome');
  const $codigo = document.getElementById('codigo');
  const $capacidade = document.getElementById('capacidade');
  const $descricao = document.getElementById('descricao');

  document.getElementById('btn-recarregar').addEventListener('click', carregar);
  document.getElementById('btn-clear').addEventListener('click', () => setForm());
  filtro.addEventListener('input', () => render());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const cap = parseInt($capacidade.value, 10);
    if(!$nome.value.trim() || !$codigo.value.trim() || !cap || cap < 1){
      showErrors(['Preencha os campos obrigatórios. Capacidade deve ser maior que zero.']);
      return;
    }

    const payload = {
      nome: $nome.value.trim(),
      codigo: $codigo.value.trim(),
      descricao: $descricao.value.trim() || null,
      capacidade: cap
    };

    try {
      if($id.value){
        const updated = await api.update($id.value, payload);
        turmas = turmas.map(t => t.id === updated.id ? updated : t);
        showToast('Turma atualizada com sucesso.');
      } else {
        const created = await api.create(payload);
        turmas.push(created);
        showToast('Turma criada com sucesso.');
      }
      setForm();
      render();
    } catch (err) {
      handleApiError(err);
    }
  });

  function handleApiError(err){
    const msgs = [];
    if(err.errors && Array.isArray(err.errors) && err.errors.length){
      for(const fe of err.errors){ msgs.push(`${fe.field}: ${fe.message}`); }
    }
    if(err.message){ msgs.unshift(err.message); }
    if(!msgs.length){ msgs.push('Erro inesperado.'); }
    showErrors(msgs);
  }

  function showErrors(messages){
    formErrors.innerHTML = messages.map(m => `<li>${escapeHtml(m)}</li>`).join('');
    formErrors.classList.remove('hidden');
  }
  function clearErrors(){
    formErrors.innerHTML = '';
    formErrors.classList.add('hidden');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function setForm(t){
    clearErrors();
    if(!t){
      $id.value = '';
      $nome.value = '';
      $codigo.value = '';
      $capacidade.value = '';
      $descricao.value = '';
      formMode.textContent = 'Novo';
    } else {
      $id.value = t.id;
      $nome.value = t.nome ?? '';
      $codigo.value = t.codigo ?? '';
      $capacidade.value = t.capacidade ?? '';
      $descricao.value = t.descricao ?? '';
      formMode.textContent = `Editando #${t.id}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function render(){
    const q = (filtro.value || '').trim().toLowerCase();
    const lista = !q ? turmas : turmas.filter(t =>
      (t.nome||'').toLowerCase().includes(q) || (t.codigo||'').toLowerCase().includes(q)
    );

    if(!lista.length){
      tbody.innerHTML = `<tr><td colspan="6" class="muted">Nenhuma turma encontrada.</td></tr>`;
      return;
    }

    tbody.innerHTML = lista.map(t => `
      <tr>
        <td class="hide-sm">${t.id}</td>
        <td>${escapeHtml(t.nome||'')}</td>
        <td>${escapeHtml(t.codigo||'')}</td>
        <td>${t.capacidade ?? ''}</td>
        <td class="hide-sm">${escapeHtml(t.descricao||'')}</td>
        <td class="right">
          <button class="btn-link" title="Editar" onclick='onEditar(${JSON.stringify(t.id)})'>Editar</button>
          <button class="btn-link" title="Excluir" onclick='onExcluir(${JSON.stringify(t.id)})'>Excluir</button>
        </td>
      </tr>
    `).join('');
  }

  async function onEditar(id){
    try{ const t = await api.get(id); setForm(t); }
    catch(err){ showToast(err.message || 'Erro ao buscar turma'); }
  }

  async function onExcluir(id){
    const t = turmas.find(x => x.id === id);
    const nome = t ? ` (${t.nome})` : '';
    if(!confirm(`Confirma excluir a turma #${id}${nome}?`)) return;
    try{
      await api.remove(id);
      turmas = turmas.filter(x => x.id !== id);
      render();
      showToast('Turma excluída.');
      if($id.value == id){ setForm(); }
    }catch(err){ showToast(err.message || 'Erro ao excluir turma'); }
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.add('hidden'), 2500);
  }

  async function carregar(){
    tbody.innerHTML = `<tr><td colspan="6" class="muted">Carregando...</td></tr>`;
    try { turmas = await api.list(); }
    catch (err) { turmas = []; showToast(err.message || 'Erro ao carregar turmas'); }
    render();
  }

  carregar();
</script>
</body>
</html>
