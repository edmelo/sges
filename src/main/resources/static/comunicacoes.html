<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGES - Comunicações</title>
  <style>
    :root { --primary:#1f6feb; --danger:#d32f2f; --ok:#2e7d32; --muted:#666; }
    html, body { margin:0; padding:0; font-family:Segoe UI, Roboto, Arial, Helvetica, sans-serif; background:#f6f8fa; color:#0a0a0a; }
    header { background:#0d1117; color:#fff; padding:16px 20px; display:flex; gap:16px; align-items:center; }
    header h1 { margin:0; font-size:20px; flex:1; }
    header nav a { color:#c9d1d9; text-decoration:none; margin-left:12px; }
    header nav a:hover { color:#fff; text-decoration:underline; }
    main { padding:20px; max-width:1200px; margin:0 auto; }
    .card { background:#fff; border:1px solid #d0d7de; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
    .card + .card { margin-top:16px; }
    .card-header { padding:12px 16px; border-bottom:1px solid #d0d7de; font-weight:600; display:flex; gap:10px; align-items:center; }
    .card-body { padding:16px; }
    form .row { display:flex; gap:12px; flex-wrap:wrap; }
    .field { flex:1 1 220px; min-width:200px; }
    label { display:block; font-size:12px; color:#444; margin-bottom:6px; }
    input, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #c7ccd1; border-radius:6px; font-size:14px; }
    textarea { min-height: 90px; }
    input:focus, textarea:focus { outline:2px solid var(--primary); border-color:var(--primary); }
    .actions { display:flex; gap:10px; margin-top:12px; }
    button { cursor:pointer; border:1px solid transparent; border-radius:6px; padding:10px 14px; font-weight:600; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-secondary { background:#eaeef2; color:#111; }
    .btn-link { background:transparent; color:var(--primary); padding:6px 8px; border:none; }
    .muted { color:var(--muted); }
    table { border-collapse:collapse; width:100%; }
    th, td { border-bottom:1px solid #e6ebf1; padding:10px 8px; text-align:left; font-size:14px; }
    th { background:#f0f3f6; font-weight:600; }
    tr:hover td { background:#fafbfc; }
    .right { text-align:right; }
    .errors { margin:0; padding-left:18px; color:var(--danger); }
    .toast { position:fixed; right:20px; bottom:20px; background:#111; color:#fff; padding:10px 14px; border-radius:8px; opacity:0.95; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid #c7ccd1; background:#fff; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<header>
  <h1>SGES - Comunicações</h1>
  <nav>
    <a href="/">Alunos</a>
    <a href="/professores.html">Professores</a>
    <a href="/turmas.html">Turmas</a>
    <a href="/avaliacoes.html">Avaliações</a>
    <a href="/frequencias.html">Frequências</a>
    <a href="/comunicacoes.html" aria-current="page">Comunicações</a>
    <a href="/financeiro.html">Financeiro</a>
  </nav>
</header>
<main>
  <section class="card" aria-labelledby="form-title">
    <div class="card-header">
      <span id="form-title">Nova Comunicação</span>
      <span id="form-mode" class="badge" aria-live="polite">Nova</span>
    </div>
    <div class="card-body">
      <form id="com-form" novalidate>
        <input type="hidden" id="id" />
        <div class="row">
          <div class="field"><label for="titulo">Título *</label><input id="titulo" required maxlength="120" /></div>
          <div class="field"><label for="data">Data *</label><input id="data" type="date" required /></div>
          <div class="field"><label for="autor">Autor</label><input id="autor" maxlength="120" placeholder="Opcional" /></div>
        </div>
        <div class="row">
          <div class="field" style="flex:2 1 460px;"><label for="conteudo">Conteúdo *</label><textarea id="conteudo" required maxlength="2000" placeholder="Mensagem"></textarea></div>
        </div>
        <div class="row">
          <div class="field"><label for="turmaId">Turma (ID)</label><input id="turmaId" type="number" min="1" placeholder="Opcional" /></div>
          <div class="field"><label for="alunoId">Aluno (ID)</label><input id="alunoId" type="number" min="1" placeholder="Opcional" /></div>
        </div>
        <ul id="form-errors" class="errors hidden" aria-live="polite"></ul>
        <div class="actions">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="btn-clear" class="btn-secondary">Limpar</button>
        </div>
        <p class="muted">Informe um aluno ou uma turma como destinatário.</p>
      </form>
    </div>
  </section>

  <section class="card" aria-labelledby="list-title">
    <div class="card-header"><span id="list-title">Comunicados</span></div>
    <div class="card-body">
      <div style="overflow:auto;">
        <table>
          <thead><tr><th>ID</th><th>Título</th><th>Data</th><th>Autor</th><th>Turma</th><th>Aluno</th><th class="right">Ações</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
  const api = {
    list: () => fetch(`/api/comunicacoes`).then(r=>okJson(r)),
    get: (id) => fetch(`/api/comunicacoes/${id}`).then(r=>okJson(r)),
    create: (d) => fetch(`/api/comunicacoes`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)}).then(r=>okJson(r)),
    update: (id, d) => fetch(`/api/comunicacoes/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)}).then(r=>okJson(r)),
    remove: (id) => fetch(`/api/comunicacoes/${id}`, {method:'DELETE'}).then(r=>okVoid(r)),
  };
  function okJson(resp){ if(resp.ok) return resp.json(); return resp.json().catch(()=>({message:resp.statusText})).then(e=>Promise.reject(e)); }
  function okVoid(resp){ if(resp.ok) return; return resp.json().catch(()=>({message:resp.statusText})).then(e=>Promise.reject(e)); }

  let comunicados=[];
  const tbody=document.getElementById('tbody');
  const form=document.getElementById('com-form');
  const formErrors=document.getElementById('form-errors');
  const formMode=document.getElementById('form-mode');
  const toast=document.getElementById('toast');

  const $id=document.getElementById('id');
  const $titulo=document.getElementById('titulo');
  const $data=document.getElementById('data');
  const $autor=document.getElementById('autor');
  const $conteudo=document.getElementById('conteudo');
  const $turmaId=document.getElementById('turmaId');
  const $alunoId=document.getElementById('alunoId');

  document.getElementById('btn-clear').addEventListener('click', ()=>setForm());

  form.addEventListener('submit', async (e)=>{
    e.preventDefault(); clearErrors();
    if(!$titulo.value.trim()||!$data.value||!$conteudo.value.trim()){
      showErrors(['Preencha título, data e conteúdo.']); return;
    }
    if(!$turmaId.value && !$alunoId.value){ showErrors(['Informe alunoId ou turmaId.']); return; }
    const payload={
      titulo:$titulo.value.trim(), conteudo:$conteudo.value.trim(), data:$data.value,
      autor:$autor.value.trim()||null,
      turmaId: $turmaId.value ? Number($turmaId.value) : null,
      alunoId: $alunoId.value ? Number($alunoId.value) : null,
    };
    try{
      if($id.value){ const up=await api.update($id.value, payload); comunicados=comunicados.map(c=>c.id===up.id?up:c); showToast('Comunicação atualizada.'); }
      else { const cr=await api.create(payload); comunicados.push(cr); showToast('Comunicação criada.'); }
      setForm(); render();
    }catch(err){ handleApiError(err); }
  });

  function handleApiError(err){ const msgs=[]; if(err.errors&&Array.isArray(err.errors)){ for(const fe of err.errors){ msgs.push(`${fe.field}: ${fe.message}`);} } if(err.message) msgs.unshift(err.message); if(!msgs.length) msgs.push('Erro inesperado.'); showErrors(msgs); }
  function showErrors(messages){ formErrors.innerHTML=messages.map(m=>`<li>${escapeHtml(m)}</li>`).join(''); formErrors.classList.remove('hidden'); }
  function clearErrors(){ formErrors.innerHTML=''; formErrors.classList.add('hidden'); }
  function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function setForm(c){ clearErrors(); if(!c){ $id.value=''; $titulo.value=''; $data.value=''; $autor.value=''; $conteudo.value=''; $turmaId.value=''; $alunoId.value=''; formMode.textContent='Nova'; }
    else { $id.value=c.id; $titulo.value=c.titulo||''; $data.value=c.data||''; $autor.value=c.autor||''; $conteudo.value=c.conteudo||''; $turmaId.value=c.turmaId||''; $alunoId.value=c.alunoId||''; formMode.textContent=`Editando #${c.id}`; window.scrollTo({top:0,behavior:'smooth'}); } }

  function render(){ if(!comunicados.length){ tbody.innerHTML=`<tr><td colspan="7" class="muted">Nenhum comunicado.</td></tr>`; return; }
    tbody.innerHTML = comunicados.map(c=>`
      <tr>
        <td>${c.id}</td>
        <td>${escapeHtml(c.titulo||'')}</td>
        <td>${formatDateBR(c.data)}</td>
        <td>${escapeHtml(c.autor||'')}</td>
        <td>${c.turmaId??''}</td>
        <td>${c.alunoId??''}</td>
        <td class="right">
          <button class="btn-link" onclick='setForm(${JSON.stringify(nullSafe(c))})'>Editar</button>
          <button class="btn-link" onclick='onExcluir(${JSON.stringify(c.id)})'>Excluir</button>
        </td>
      </tr>`).join(''); }

  function nullSafe(c){ return {id:c.id,titulo:c.titulo||'',data:c.data||'',autor:c.autor||'',conteudo:c.conteudo||'',turmaId:c.turmaId||'',alunoId:c.alunoId||''}; }
  function formatDateBR(iso){ if(!iso) return ''; const m=/(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m? `${m[2]}/${m[3]}/${m[1]}`: iso; }

  async function onExcluir(id){ if(!confirm(`Excluir comunicação #${id}?`)) return; try{ await api.remove(id); comunicados=comunicados.filter(x=>x.id!==id); render(); showToast('Comunicação excluída.'); if($id.value==id){ setForm(); } }catch(e){ showToast(e.message||'Erro ao excluir'); } }

  function showToast(msg){ toast.textContent=msg; toast.classList.remove('hidden'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.add('hidden'), 2500); }

  async function carregar(){ tbody.innerHTML = `<tr><td colspan="7" class="muted">Carregando...</td></tr>`; try{ comunicados = await api.list(); }catch(e){ comunicados=[]; showToast(e.message||'Falha ao carregar'); } render(); }
  carregar();
</script>
</body>
</html>
